<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>曲文基 · 个人主页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f2f7f3'/%3E%3Ctext x='32' y='44' font-size='34' font-family='sans-serif' font-weight='700' fill='%233d8b5f' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f2f7f3;color:#1e2d24;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }
  body::before{
    content:"";position:absolute;width:600px;height:600px;border-radius:50%;
    background:radial-gradient(circle,rgba(61,139,95,.18),transparent 65%);
    top:-200px;left:-200px;
  }
  body::after{
    content:"";position:absolute;width:500px;height:500px;border-radius:50%;
    background:radial-gradient(circle,rgba(91,171,126,.15),transparent 65%);
    bottom:-180px;right:-180px;
  }
  .wrap{text-align:center;position:relative;z-index:2;padding:24px;animation:fadeUp .8s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .avatar{
    width:220px;height:220px;border-radius:50%;overflow:hidden;margin:0 auto 28px;
    border:4px solid #fff;
    box-shadow:0 20px 50px rgba(61,139,95,.25),0 0 0 8px rgba(61,139,95,.1);
    transition:transform .3s ease,box-shadow .3s ease;cursor:pointer;display:block;
  }
  .avatar:hover{transform:scale(1.05);box-shadow:0 25px 60px rgba(61,139,95,.35),0 0 0 12px rgba(61,139,95,.15)}
  .avatar img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
  h1{font-size:32px;font-weight:900;letter-spacing:4px;margin-bottom:10px}
  .tagline{font-size:15px;color:#5c6b60;font-weight:300;margin-bottom:24px}
  .enter{
    display:inline-block;padding:12px 36px;border-radius:100px;
    background:#3d8b5f;color:#fff;font-size:14px;letter-spacing:2px;
    text-decoration:none;transition:background .2s,transform .2s;
    box-shadow:0 8px 20px rgba(61,139,95,.3);
  }
  .enter:hover{background:#2d7a4f;transform:translateY(-2px)}
  .hint{font-size:12px;color:#8a9a8f;margin-top:20px;letter-spacing:1px}
  @media(max-width:500px){.avatar{width:180px;height:180px}h1{font-size:26px}}
</style>
</head>
<body>
  <div class="wrap">
    <a href="home.html" class="avatar" title="点击进入主页">
      <img src="assets/avatar.jpg" alt="曲文基">
    </a>
    <h1>曲文基</h1>
    <p class="tagline">同济大学 · 工业工程硕士在读</p>
    <a href="home.html" class="enter">进入主页</a>
    <p class="hint">点击头像或按钮进入</p>
  </div>
</body>
</html>
